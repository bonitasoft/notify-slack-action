name: Notify Slack
description: Send a message to a channel Slack
author: Bonitasoft

inputs:
  keeper-secret-config:
    description: The Keeper Secret Manager configuration
    required: true
  channel-id:
    description: The Slack channel id where to send the message
    required: true
    default: C02J5M4JMK7 # channel slack-integration-test
  message:
    description: The message to display in first block of notification, also used as the top-level notification text
    required: true
    default: ":ok_hand: Action on branch ${{ github.ref }} is triggered"
  previous-message-ts:
    description: The timestamp of a previous message posted. It will update the existing message instead of posting a new message.
    required: false

outputs:
  message-timestamp:
    description: The timestamp of the message posted
    value: ${{ steps.slack-action.outputs.ts }}

runs:
  using: composite
  steps:
    - name: Retrieve Slack OAuth token from Keeper
      uses: Keeper-Security/ksm-action@bb4c5568aaf752666e3029748495cd819c88c446 # v1.4.0
      with:
        keeper-secret-config: ${{ inputs.keeper-secret-config }}
        secrets: |
          SpEPtxeWhDrmEJKdIwsIKw/field/password > env:SLACK_BOT_TOKEN

    # slack-github-action v1 trimmed these inputs, v2+ sends them to Slack as is
    - name: Trim Slack inputs
      id: inputs
      shell: bash
      env:
        CHANNEL_ID: ${{ inputs.channel-id }}
        PREVIOUS_MESSAGE_TS: ${{ inputs.previous-message-ts }}
      run: |
        trim() {
          local value="${1#"${1%%[![:space:]]*}"}"
          printf '%s' "${value%"${value##*[![:space:]]}"}"
        }
        echo "channel-id=$(trim "$CHANNEL_ID")" >> "$GITHUB_OUTPUT"
        echo "previous-message-ts=$(trim "$PREVIOUS_MESSAGE_TS")" >> "$GITHUB_OUTPUT"

    - name: Send message to Slack channel
      id: slack-action
      uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
      with:
        method: ${{ steps.inputs.outputs.previous-message-ts && 'chat.update' || 'chat.postMessage' }}
        token: ${{ env.SLACK_BOT_TOKEN }}
        # fail the step when Slack rejects the call, as slack-github-action v1 did
        errors: true
        payload: |
          {
            "channel": ${{ toJSON(steps.inputs.outputs.channel-id) }},
            ${{ steps.inputs.outputs.previous-message-ts && format('"ts": {0},', toJSON(steps.inputs.outputs.previous-message-ts)) || '' }}
            "text": ${{ toJSON(format('{0}{1}More details <https://github.com/{2}/actions/runs/{3}?check_suite_focus=true| here>', inputs.message, fromJSON('"\n"'), github.repository, github.run_id)) }},
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": ${{ toJSON(inputs.message) }}
                }
              },
              {
                "type": "divider"
              },
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "More details <https://github.com/${{github.repository}}/actions/runs/${{github.run_id}}?check_suite_focus=true| here>"
                }
              }
            ]
          }
